name: Docker Image

# 构建 OtterHub Docker 镜像并推送 Docker Hub
# 所需 Secrets（仓库 Settings -> Secrets and variables -> Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名（totootao）
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌或密码
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to Docker Hub (requires valid secrets)"
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如需 arm64（树莓派/ARM 服务器），改为 platforms: linux/amd64,linux/arm64
      # 注意：QEMU 下构建耗时显著增加
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.push_image == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'totootao' }}/otterhub-server
          tags: |
            # master 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 标签 → 1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 每次构建附加短 commit sha
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build result summary
        if: github.event_name == 'push' || inputs.push_image == true
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- repo: <username>/otterhub on Docker Hub" >> "$GITHUB_STEP_SUMMARY"
